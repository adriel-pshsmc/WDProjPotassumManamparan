<!DOCTYPE html>
<head>
    <!--
        NOTE: Recommended <head> items to add (copy/paste and adjust values):
        1) <meta charset="utf-8">                      -- put first for correct text encoding
        2) <meta name="viewport" content="width=device-width, initial-scale=1"> -- mobile responsiveness
        3) <title>Page title</title>
        4) <meta name="description" content="Short description for SEO/social">
        5) <link rel="stylesheet" href="/styles.css">   -- ensure correct path; use ../styles.css in subpages/
        6) <link rel="icon" href="/images/favicon.png"> -- or ../images/favicon.png from subpages/
        7) Social: og:title, og:description, og:image, twitter:card for nicer previews
        8) <meta name="theme-color" content="#bf0d3e">    -- optional
        9) <script src="/script.js" defer></script>      -- use defer or place before </body>; use ../script.js in subpages/

        Common gotchas:
        - Relative paths in subpages (files inside `subpages/`) need `../` to reach project root.
        - Avoid multiple, conflicting CSS files; edit the one your pages actually link.
        - Use DevTools Network to check for 404s when CSS/JS doesn't load.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Database</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
