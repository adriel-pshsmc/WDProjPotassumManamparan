<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Register — Scientia Unitia</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="icon" type="image/png" href="../images/temp_favicon.png">
        <script src="../script.js" defer></script>
        <style>
            .register-card {
                max-width: 640px;
                margin: 2rem auto;
                padding: 1.2rem;
                border: 1px solid #dddddd;
                border-radius: 6px;
                background: #ffffff;
            }

            .form-row { margin: 0.6rem 0; }
        </style>
    </head>

    <body>
        <div id="mySidenav" class="sidenav">
            <div class="sidenav-top">
                <button class="sidenav-toggle-inside" onclick="toggleNav()">☰</button>
                <a href="../index.html" class="sidenav-logo-link"><img src="images/temp_favicon.png" alt="Scientia Unitia Logo" class="sidenav-logo"></a>
                <span href="../index.html" class="sidenav-title">Scientia Unitia</span>
            </div>

            <a href="../index.html">Home</a>
            <a href="document.html">Document</a>
            <a href="events.html">Events</a>
            <a href="references.html">References</a>
            <a href="signin.html">Sign In</a>
            <a href="register.html">Register</a>
        </div>

        <div id="main">
            <header>
                <nav class="horizontal-navigation-bar">
                    <button id="sidenavToggle" class="sidenav-toggle" aria-label="Toggle menu" onclick="toggleNav()">☰</button>
                    <div class="website-logos">
                        <a href="../index.html"><img class="logo" src="../images/temp_favicon.png" alt="logo"></a>
                        <a class="title" href="../index.html">Scientia Unitia</a>
                    </div>
                    <ul class="navigation-buttons">
                        <li><a class="navigation-button" href="../index.html">Home</a></li>
                        <li><a class="navigation-button" href="document.html">Document</a></li>
                        <li><a class="navigation-button" href="signin.html">Sign In</a></li>
                        <li><a class="navigation-button" href="events.html">Events</a></li>
                        <li><a class="navigation-button" href="references.html">References</a></li>
                        <li><a class="navigation-button" href="register.html">Register</a></li>
                    </ul>
                </nav>
            </header>

            <main>
                <section class="register-card">
                    <h2>Register</h2>
                    <form class="register-form" action="#" method="post" aria-label="Register form">
                        <div class="form-row">
                            <label for="reg-username">Username</label>
                            <input id="reg-username" name="username" type="text" required placeholder="yourname">
                        </div>

                        <div class="form-row">
                            <label for="reg-email">Email</label>
                            <input id="reg-email" name="email" type="email" required placeholder="you@example.com">
                        </div>

                        <div class="form-row">
                            <label for="reg-password">Password</label>
                            <input id="reg-password" name="password" type="password" required placeholder="Minimum 8 characters">
                        </div>

                        <div class="form-row">
                            <label for="reg-password2">Confirm password</label>
                            <input id="reg-password2" name="password2" type="password" required placeholder="Repeat password">
                        </div>

                        <div class="form-row">
                            <button type="submit" class="btn">Create account</button>
                        </div>
                    </form>
                    <p class="small">Already have an account? <a href="signin.html">Sign in</a></p>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 Manamparan, Adriel Lenard C.</p>
            </footer>
        </div>
    </body>
</html>
